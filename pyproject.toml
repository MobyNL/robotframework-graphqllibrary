[tool.poetry]
# The lock file is format 2.1, which Poetry 1.x cannot read. Poetry 2.x enforces this key;
# Poetry 1.x does not understand it and rejects the file as invalid, naming `requires-poetry` -
# not the message written here, but a searchable pointer rather than a lock-format error further
# on. CI installs Poetry with `pipx install poetry`, so it is already on 2.x.
requires-poetry = ">=2.0"
name = "robotframework-graphql"
version = "0.2.0"
description = "GraphQL test library for Robot Framework."
authors = ["MobyNl <markmoberts@gmail.com>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/MobyNl/robotframework-graphqllibrary"
homepage = "https://github.com/MobyNl/robotframework-graphqllibrary"
keywords = ["robotframework", "graphql", "testing", "library", "api"]
classifiers = [
    "Framework :: Robot Framework",
    "Framework :: Robot Framework :: Library",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
package-mode = true

packages = [
    { include = "GraphQLLibrary" }
]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
# Robot Framework 6.1.1 is the floor, and nothing imposes it: this library imports nothing
# from `robot` that needs it, and assertion engine 3.0.3 below would allow 5.0.1. It is the
# oldest version the suites are actually run against, so it is the oldest that is claimed.
# `Secret` is imported conditionally, so 6.1.1 through 7.x are supported from one code path.
robotframework = ">=6.1.1,<8"
# Capped below 5.0.0 by assertion engine 3.0.3, which is the floor below.
robotframework-pythonlibcore = ">=4.6,<5"
# Only `verify_assertion` and `AssertionOperator` are imported from here, and both are
# unchanged from 3.0.3 through 5.x - the `verify_assertion` signature is identical across that
# range. The floor is therefore set by the API this library actually uses, rather than by a
# preference for the newest line, so the library can be installed alongside a suite already
# pinned to an older assertion engine. The cap stays on the major, where a breaking change to
# those two names would land. The floor pairing is exercised in CI, since pip resolves to the
# newest 5.x on its own and would never reach 3.0.3.
robotframework-assertion-engine = ">=3.0.3,<6"
# 4.0 is the floor: it is where `gql()` started returning a `GraphQLRequest` instead of a
# `DocumentNode`, which is the object this library passes around. Transports are extras, so
# the `requests` marker keeps the dependency tree to the sync HTTP path only - aiohttp and
# websockets are deliberately not pulled in. The cap is on the major because gql's beta
# lines run for years and are not depended on here.
gql = {version = ">=4.0,<5", extras = ["requests"]}
# Arrives transitively through gql, but declared because this library uses it directly and for
# more than parsing: `parse` and `validate` for checking queries, `get_introspection_query` and
# `build_client_schema` for reading a schema, and `print_schema`, `build_schema`,
# `find_breaking_changes` and `find_dangerous_changes` for the drift keywords. Until 0.2.0 this
# comment claimed `validate` was called when it was not; it is now.
# Capped below 3.3, which is still in release candidates and which both gql and sgqlc also cap.
graphql-core = ">=3.2,<3.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-cov = "^6.2.1"
responses = "^0.25.3"
ruff = "^0.12.4"
mypy = "^1.18.2"
# 8.x rather than 6.x for a packaging reason as much as a feature one: robocop 6.x imports
# `click` in `run.py` and `files.py` without declaring it, so `robocop check` dies with
# ModuleNotFoundError in an environment that has nothing else pulling click in. 8.x declares
# what it imports, which is why no `click` entry is needed here.
robotframework-robocop = "^8.8"
robotframework-requests = "^0.9.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"  # the oldest Python the package supports
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]  # imports
ignore = ["E731"]  # lambda assignment

[tool.ruff.lint.isort]
combine-as-imports = true
order-by-type = false

[tool.mypy]
python_version = "3.10"
files = ["GraphQLLibrary"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
# None of these ship type information.
module = ["assertionengine.*", "robotlibcore.*", "robot.*", "gql.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["utest"]

[tool.coverage.run]
branch = true
source = ["GraphQLLibrary"]

[tool.robocop.lint]
ignore = [
    "missing-doc-test-case",
    "missing-doc-suite",
    # Both rules push the suites onto Robot Framework 7 syntax (`VAR` in place of
    # `Set Variable` and `Create Dictionary`). The suites have to stay runnable on the
    # oldest Robot Framework this library supports, which is 6.1.1.
    "replace-create-with-var",
    "replace-set-variable-with-var",
]
configure = [
    "line-too-long.line_length=140",
    "too-many-arguments.max_args=10",
]

[tool.robot]
log-level = "DEBUG"
